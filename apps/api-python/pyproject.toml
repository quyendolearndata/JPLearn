[project]
name = "jplearn-api"
version = "0.1.0"
description = "JPLearn API (FastAPI). Owns DDL via Alembic (ADR-004); SQLAlchemy models stay mapping-only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
jplearn-openapi-diff = "jplearn_api.tooling.openapi_diff:main"
jplearn-migrate = "jplearn_api.entrypoints.cli.migrate:main"
jplearn-seed = "jplearn_api.entrypoints.cli.seed:main"
jplearn-maintenance = "jplearn_api.entrypoints.cli.maintenance:main"
jplearn-ai-worker = "jplearn_api.entrypoints.cli.ai_worker:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jplearn_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_media_probe: requires local ffmpeg and ffprobe executables",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI dependency injection intentionally evaluates Depends() in parameter defaults.
# UP042 is ignored because StrEnum changes str(enum_member) from Class.MEMBER to its value.
ignore = ["B008", "UP042"]

[tool.uv]
package = true
