[alembic]
script_location = src/jplearn_api/migrations
prepend_sys_path = src
version_path_separator = os

# DATABASE_URL from the environment is the single source (see migrations/env.py).
# Alembic owns DDL as of ADR-004; revisions are hand-written, never autogenerated.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
