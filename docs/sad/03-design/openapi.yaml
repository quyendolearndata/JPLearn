components:
  parameters:
    RequestIdHeader:
      in: header
      name: x-request-id
      required: false
      schema:
        type: string
      description: Optional trace id; server echoes it. If omitted, server generates
        a UUID.
  headers:
    XRequestId:
      description: Echo of request `x-request-id`, or a generated UUID
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    signedQuery:
      type: apiKey
      in: query
      name: sig
      description: HMAC-SHA256 signature for media streaming (with exp timestamp)
  schemas:
    Health:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          enum:
          - true
    Ready:
      type: object
      required:
      - ok
      - database
      - storage
      properties:
        ok:
          type: boolean
        database:
          type: string
          enum:
          - up
          - down
        storage:
          type: string
          enum:
          - up
          - down
    HttpError:
      type: object
      description: Standard JSON error body (400, 403, 404, 500) per ADR-005.
      required:
      - statusCode
      - message
      - error
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        error:
          type: string
    Http401Error:
      type: object
      description: Distinct 401 Unauthorized JSON error body per ADR-005.
      required:
      - statusCode
      - message
      properties:
        statusCode:
          type: integer
          enum:
          - 401
        message:
          type: string
    MediaAssetStaff:
      type: object
      required:
      - id
      - catalog_item_id
      - storage_key
      - playback_url
      - mime
      properties:
        id:
          type: string
          format: uuid
        catalog_item_id:
          type: string
        storage_key:
          type: string
        playback_url:
          type: string
        hls_url:
          type: string
          nullable: true
        mime:
          type: string
        measured_duration_ms:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        source_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        hls_bundle_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
    AuthSession:
      type: object
      required:
      - access_token
      - user
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - email
      - roles
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - learner
            - teacher
            - admin
    CatalogItemPublic:
      type: object
      description: Learner-facing. No L1 translation fields.
      required:
      - id
      - ci_level
      - duration_seconds
      - media_type
      - topic_id
      - visual_support
      properties:
        id:
          type: string
          format: uuid
        ci_level:
          type: integer
        duration_seconds:
          type: integer
        media_type:
          type: string
          enum:
          - video
          - audio
        topic_id:
          type: string
        visual_support:
          type: string
          enum:
          - high
          - medium
          - low
        playback_url:
          type: string
          format: uri
          nullable: true
        hls_url:
          type: string
          format: uri
          nullable: true
          description: NFR-PERF-002 HLS manifest when transcoded; clients prefer it
            and fall back to playback_url.
    CatalogItemWrite:
      type: object
      required:
      - topic_id
      - ci_level
      - duration_seconds
      - media_type
      - visual_support
      - title_internal
      properties:
        topic_id:
          type: string
        ci_level:
          type: integer
          description: v1 write has no min/max (Prisma Int). GET /catalog?ci_level=
            is 0–4.
        duration_seconds:
          type: integer
        media_type:
          type: string
          enum:
          - video
          - audio
        visual_support:
          type: string
          enum:
          - high
          - medium
          - low
        title_internal:
          type: string
    CatalogItemStaff:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        topic_id:
          type: string
          title: Topic Id
        ci_level:
          type: integer
          title: Ci Level
        duration_seconds:
          type: integer
          title: Duration Seconds
        media_type:
          type: string
          enum:
          - video
          - audio
          title: Media Type
        visual_support:
          type: string
          enum:
          - high
          - medium
          - low
          title: Visual Support
        title_internal:
          type: string
          title: Title Internal
        has_l1_translation:
