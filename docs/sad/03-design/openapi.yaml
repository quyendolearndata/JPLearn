          default: 1
        qa_round:
          type: integer
          title: Qa Round
          default: 0
      additionalProperties: false
      type: object
      required:
      - id
      - topic_id
      - ci_level
      - duration_seconds
      - media_type
      - visual_support
      - title_internal
