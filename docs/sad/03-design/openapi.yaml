openapi: 3.0.3
info:
  title: JPLearn Platform API
  version: 0.1.0
  description: 'Foundation v1. No grammar, flashcards, or L1 translation channels.


    Contract authority is this file (OpenAPI 3.0.3), not FastAPI-generated 3.1 JSON.

    Semantic normalized diff (ADR-003 D9): must match HTTP status, required/nullability,

    security, operationId, x-jplearn-fr, and error schema. Allowlist: 3.0↔3.1 nullable

    vs type union, generated component names, servers, info.


    Docs UI (`/docs`, `/redoc`, `/openapi.json`): off on staging and prod; local dev
    may

    enable. Contract tests read this file in git — do not depend on a public OpenAPI
    URL.

    '
servers:
- url: https://api.staging.jplearn.local
paths:
  /health:
    get:
      operationId: health
      tags:
      - Observability
      x-jplearn-fr:
      - NFR-OBS-001
      description: Liveness. Echoes `x-request-id` (client value or generated UUID).
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: API process is up
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: ready
      tags:
      - Observability
      x-jplearn-fr:
      - NFR-OBS-001
      description: Readiness. Checks database connectivity and storage dependency.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Service dependencies are healthy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: One or more service dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
  /auth/register:
    post:
      operationId: register
      tags:
      - Identity
      x-jplearn-fr:
      - FR-ID-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
  /auth/login:
    post:
      operationId: login
      tags:
      - Identity
      x-jplearn-fr:
      - FR-ID-001
      - FR-ID-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Identity
      x-jplearn-fr:
      - FR-ID-003
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Invalidates every access_token for this user (all devices);
            tokenVersion increment (FR-ID-003)
        '401':
          description: Missing or invalid Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /me:
    get:
      operationId: getMe
      tags:
      - Identity
      x-jplearn-fr:
      - FR-ID-002
      - FR-ID-004
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /me/saved-scenes:
    get:
      operationId: listSavedScenes
      tags:
      - Library
      summary: List Saved Scenes
      x-jplearn-fr:
      - FR-BMK-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          title: Limit
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          nullable: true
          title: Cursor
      responses:
        '200':
          description: List of saved scenes with availability projection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedSceneItemPublic'
                title: Response Listsavedscenes
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /me/saved-scenes/{scene_id}:
    put:
      operationId: saveScene
      tags:
      - Library
      summary: Save Scene
      x-jplearn-fr:
      - FR-BMK-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scene_id
        required: true
        schema:
          type: string
          format: uuid
          title: Scene Id
      responses:
        '200':
          description: Scene was already saved (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedScenePublic'
        '201':
          description: Scene successfully saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedScenePublic'
        '400':
          description: Scene not in published current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '404':
          description: Scene not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    delete:
      operationId: deleteSavedScene
      tags:
      - Library
      summary: Delete Saved Scene
      x-jplearn-fr:
      - FR-BMK-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scene_id
        required: true
        schema:
          type: string
          format: uuid
          title: Scene Id
      responses:
        '204':
          description: Saved scene deleted idempotently
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /me/collections:
    post:
      operationId: createCollection
      tags:
      - Library
      summary: Create Collection
      x-jplearn-fr:
      - FR-COL-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 128
          nullable: true
          title: Idempotency-Key
        description: Optional idempotency key for safely retrying collection creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionBody'
      responses:
        '200':
          description: Collection was already created (idempotent replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPublic'
        '201':
          description: Collection successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPublic'
        '400':
          description: Invalid input or collection quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '409':
          description: Idempotency key reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    get:
      operationId: listCollections
      tags:
      - Library
      summary: List Collections
      x-jplearn-fr:
      - FR-COL-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          title: Limit
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          nullable: true
          title: Cursor
      responses:
        '200':
          description: List of learner collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionPublic'
                title: Response Listcollections
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /me/collections/{collection_id}:
    get:
      operationId: getCollection
      tags:
      - Library
      summary: Get Collection
      x-jplearn-fr:
      - FR-COL-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '200':
          description: Collection details including scenes and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetailPublic'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    patch:
      operationId: patchCollection
      tags:
      - Library
      summary: Patch Collection
      x-jplearn-fr:
      - FR-COL-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCollectionBody'
      responses:
        '200':
          description: Collection name successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPublic'
        '400':
          description: Invalid collection name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '409':
          description: Revision conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    delete:
      operationId: deleteCollection
      tags:
      - Library
      summary: Delete Collection
      x-jplearn-fr:
      - FR-COL-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '204':
          description: Collection deleted idempotently
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /me/collections/{collection_id}/scenes:
    put:
      operationId: updateCollectionScenes
      tags:
      - Library
      summary: Update Collection Scenes
      x-jplearn-fr:
      - FR-COL-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: collection_id
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionScenesBody'
      responses:
        '200':
          description: Collection scenes successfully replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPublic'
        '400':
          description: Invalid scene list or scene not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '409':
          description: Revision conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /catalog:
    get:
      operationId: listCatalog
      tags:
      - Catalog
      x-jplearn-fr:
      - FR-CAT-002
      - FR-CAT-003
      - FR-CAT-004
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: ci_level
        schema:
          type: integer
          minimum: 0
          maximum: 4
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItemPublic'
  /catalog/search:
    get:
      summary: Search Catalog Scenes
      operationId: searchScenes
      tags:
      - Catalog
      x-jplearn-fr:
      - FR-SCH-001
      - FR-SCH-002
      - FR-NEG
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: q
        required: true
        description: Japanese search query
        schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Japanese search query
      - in: query
        name: ci_level
        required: false
        description: Filter CI level
        schema:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 4
          - type: 'null'
          description: Filter CI level
      - in: query
        name: cursor
        required: false
        description: Opaque pagination cursor
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor
      - in: query
        name: limit
        required: false
        description: Page limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Page limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponsePublic'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '403':
          description: Scene search capability disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '409':
          description: Index generation mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /catalog/{id}/content:
    get:
      operationId: getCatalogItemContent
      tags:
      - Catalog
      x-jplearn-fr:
      - FR-SCN-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVersionPublic'
        '404':
          description: Catalog item not found or unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /series:
    get:
      operationId: listLearnerSeries
      tags:
      - Series
      x-jplearn-fr:
      - FR-SER-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: ci_level
        schema:
          type: string
      - in: query
        name: topic_id
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
          minimum: 0
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesLearnerSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
  /series/{id}:
    get:
      operationId: getLearnerSeries
      tags:
      - Series
      x-jplearn-fr:
      - FR-SER-001
      - FR-LRN-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesLearnerPublic'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '404':
          description: Series not found or has no available clips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /staff/catalog:
    get:
      operationId: listStaffCatalog
      tags:
      - CMS
      x-jplearn-fr:
      - FR-CAT-005
      - FR-CMS-001
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - draft
            - level_qa
            - published
            - archived
            type: string
          - type: 'null'
          title: Status
      - name: ci_level
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 4
            minimum: 0
          - type: 'null'
          title: Ci Level
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogStaffList'
        '403':
          description: Not teacher or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    post:
      operationId: createCatalogItem
      tags:
      - CMS
      x-jplearn-fr:
      - FR-CAT-001
      - FR-CAT-005
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemWrite'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemStaff'
        '403':
          description: Not teacher or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /staff/catalog/{id}:
    get:
      operationId: getStaffCatalogItem
      tags:
      - CMS
      x-jplearn-fr:
      - FR-CAT-005
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemDetail'
        '403':
          description: Not teacher or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '404':
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    patch:
      operationId: updateStaffCatalogItem
      tags:
      - CMS
      x-jplearn-fr:
      - FR-CAT-005
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemPatch'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemStaff'
        '400':
          description: Item is not in draft status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '403':
          description: Not teacher or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '404':
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '409':
          description: Revision conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /staff/catalog/{id}/media:
    post:
      operationId: uploadMedia
      tags:
      - CMS
      x-jplearn-fr:
      - FR-CMS-001
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Media asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetStaff'
  /media/{id}:
    get:
      operationId: streamMedia
      tags:
      - Media
      x-jplearn-fr:
      - FR-CMS-003
      - FR-CMS-004
      description: 'MP4/audio bytes. Auth is Bearer JWT **or** HMAC query `exp`+`sig`
        (TTL 1h) so `<video src>` can play without Authorization. Secret = MEDIA_SIGNING_SECRET
        or JWT_SECRET.

        '
      security:
      - bearerAuth: []
      - signedQuery: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: exp
        schema:
          type: integer
        description: Unix seconds expiry (required if no Bearer)
      - in: query
        name: sig
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Media stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid JWT/signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Error'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /media/{id}/hls/{file}:
    get:
      operationId: streamHls
      tags:
      - Media
      x-jplearn-fr:
      - NFR-PERF-002
      description: 'HLS manifest (.m3u8) and segments (.ts/.m4s); MP4 /media/{id}
        stays the fallback. Auth is Bearer JWT **or** HMAC query `exp`+`sig` (same
        as GET /media/{id}) so hls.js can fetch segments without Authorization. Manifest
        rewrite copies query onto relative URIs.

        '
      security:
      - bearerAuth: []
      - signedQuery: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
