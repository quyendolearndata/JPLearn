openapi: 3.0.3
info:
  title: JPLearn Platform API
  version: 0.1.0
  description: |
    Foundation v1. No grammar, flashcards, or L1 translation channels.

    Contract authority is this file (OpenAPI 3.0.3), not FastAPI-generated 3.1 JSON.
    Semantic normalized diff (ADR-003 D9): must match HTTP status, required/nullability,
    security, operationId, x-jplearn-fr, and error schema. Allowlist: 3.0↔3.1 nullable
    vs type union, generated component names, servers, info.

    Docs UI (`/docs`, `/redoc`, `/openapi.json`): off on staging and prod; local dev may
    enable. Contract tests read this file in git — do not depend on a public OpenAPI URL.
servers:
  - url: https://api.staging.jplearn.local
paths:
  /health:
    get:
      operationId: health
      tags: [Observability]
      x-jplearn-fr: [NFR-OBS-001]
      description: Liveness. Echoes `x-request-id` (client value or generated UUID).
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: API process is up
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      operationId: ready
      tags: [Observability]
      x-jplearn-fr: [NFR-OBS-001]
      description: Readiness. Checks database connectivity and storage dependency.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Service dependencies are healthy
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: One or more service dependencies are unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /auth/register:
    post:
      operationId: register
      tags: [Identity]
      x-jplearn-fr: [FR-ID-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: login
      tags: [Identity]
      x-jplearn-fr: [FR-ID-001, FR-ID-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      x-jplearn-fr: [FR-ID-003]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: "Invalidates every access_token for this user (all devices); tokenVersion increment (FR-ID-003)" }
        "401":
          description: Missing or invalid Bearer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HttpError" }
  /me:
    get:
      operationId: getMe
      tags: [Identity]
      x-jplearn-fr: [FR-ID-002, FR-ID-004]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /catalog:
    get:
      operationId: listCatalog
      tags: [Catalog]
      x-jplearn-fr: [FR-CAT-002, FR-CAT-003, FR-CAT-004]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: ci_level
          schema: { type: integer, minimum: 0, maximum: 4 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogItemPublic" }
  /staff/catalog:
    post:
      operationId: createCatalogItem
      tags: [CMS]
      x-jplearn-fr: [FR-CAT-001, FR-CAT-005]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemWrite" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemStaff" }
        "403": { description: Not teacher or admin }
  /staff/catalog/{id}/media:
    post:
      operationId: uploadMedia
      tags: [CMS]
      x-jplearn-fr: [FR-CMS-001]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Media asset created }
  /media/{id}:
    get:
      operationId: streamMedia
      tags: [Media]
      x-jplearn-fr: [FR-CMS-003, FR-CMS-004]
      description: >
        MP4/audio bytes. Auth is Bearer JWT **or** HMAC query `exp`+`sig` (TTL 1h)
        so `<video src>` can play without Authorization. Secret = MEDIA_SIGNING_SECRET or JWT_SECRET.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: exp
          schema: { type: integer }
          description: Unix seconds expiry (required if no Bearer)
        - in: query
          name: sig
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Media stream }
        "401": { description: Missing or invalid JWT/signature }
        "404": { description: Asset not found }
  /media/{id}/hls/{file}:
    get:
      operationId: streamHls
      tags: [Media]
      x-jplearn-fr: [NFR-PERF-002]
      description: >
        HLS manifest (.m3u8) and segments (.ts/.m4s); MP4 /media/{id} stays the fallback.
        Auth is Bearer JWT **or** HMAC query `exp`+`sig` (same as GET /media/{id}) so
        hls.js can fetch segments without Authorization. Manifest rewrite copies query onto relative URIs.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: file
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._-]+$" }
        - in: query
          name: exp
          schema: { type: integer }
          description: Unix seconds expiry (required if no Bearer)
        - in: query
          name: sig
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          content:
            application/vnd.apple.mpegurl: {}
            video/mp2t: {}
            video/iso.segment: {}
        "400": { description: Invalid or unsupported file name }
        "401": { description: Missing or invalid JWT/signature }
        "404": { description: Asset or HLS file not found }
  /staff/media/{id}/hls:
    post:
      operationId: registerHls
      tags: [CMS]
      x-jplearn-fr: [FR-CMS-001, NFR-PERF-002]
      description: Marks an asset HLS-ready after scripts/transcode-hls.sh wrote the bundle to storage/hls/{id}/.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: hls_url registered }
        "400": { description: HLS manifest missing on disk }
        "403": { description: Not teacher or admin }
  /staff/catalog/{id}/submit-qa:
    post:
      operationId: submitLevelQa
      tags: [CMS]
      x-jplearn-fr: [FR-CMS-002]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: status=level_qa }
  /staff/catalog/{id}/publish:
    post:
      operationId: publishCatalogItem
      tags: [CMS]
      x-jplearn-fr: [FR-CMS-002, FR-CMS-003, FR-CMS-004, FR-CAT-002]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: status=published }
        "400": { description: Not level_qa, or no media playback source (FR-CAT-002) }
        "403": { description: Admin only }
  /staff/catalog/{id}/unpublish:
    post:
      operationId: unpublishCatalogItem
      tags: [CMS]
      x-jplearn-fr: [FR-CMS-002, FR-CAT-002]
      description: Moves a published item back to draft so learners no longer see it.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: status=draft }
        "400": { description: Item is not published }
        "403": { description: Admin only }
        "404": { description: Catalog item not found }
  /sessions:
    post:
      operationId: startSession
      tags: [Session]
      x-jplearn-fr: [FR-SES-001, FR-SES-003, FR-EVT-001, FR-EVT-003]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_class]
              properties:
                device_class:
                  type: string
                  enum: [web, phone, ipad]
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSession" }
  /sessions/{id}/end:
    post:
      operationId: endSession
      tags: [Session]
      x-jplearn-fr: [FR-SES-002, FR-PRG-001, FR-EVT-001, FR-EVT-002]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerProgress" }
  /progress:
    get:
      operationId: getProgress
      tags: [Progress]
      x-jplearn-fr: [FR-PRG-001, FR-PRG-002, FR-PRG-003, FR-PRG-004]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerProgress" }
  /flags:
    get:
      operationId: getFlags
      tags: [Flags]
      x-jplearn-fr: [FR-FLG-001, FR-FLG-002]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flags" }
  /staff/flags:
    patch:
      operationId: patchFlags
      tags: [Flags]
      x-jplearn-fr: [FR-FLG-001]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Flags" }
      responses:
        "200": { description: Updated }
        "403": { description: Admin only }
components:
  parameters:
    RequestIdHeader:
      in: header
      name: x-request-id
      required: false
      schema: { type: string }
      description: Optional trace id; server echoes it. If omitted, server generates a UUID.
  headers:
    XRequestId:
      description: Echo of request `x-request-id`, or a generated UUID
      schema: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    Ready:
      type: object
      required: [ok, database, storage]
      properties:
        ok: { type: boolean }
        database: { type: string, enum: [up, down] }
        storage: { type: string, enum: [up, down] }
    HttpError:
      type: object
      description: NestJS default JSON error body. FastAPI must map 422 validation to 400 + this shape.
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        error: { type: string }
    AuthSession:
      type: object
      required: [access_token, user]
      properties:
        access_token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, email, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [learner, teacher, admin]
    CatalogItemPublic:
      type: object
      description: Learner-facing. No L1 translation fields.
      required: [id, ci_level, duration_seconds, media_type, topic_id, visual_support]
      properties:
        id: { type: string, format: uuid }
        ci_level: { type: integer }
        duration_seconds: { type: integer }
        media_type: { type: string, enum: [video, audio] }
        topic_id: { type: string }
        visual_support: { type: string, enum: [high, medium, low] }
        playback_url: { type: string, format: uri }
        hls_url:
          type: string
          format: uri
          description: NFR-PERF-002 HLS manifest when transcoded; clients prefer it and fall back to playback_url.
    CatalogItemWrite:
      type: object
      required: [topic_id, ci_level, duration_seconds, media_type, visual_support, title_internal]
      properties:
        topic_id: { type: string }
        ci_level:
          type: integer
          description: v1 write has no min/max (Prisma Int). GET /catalog?ci_level= is 0–4.
        duration_seconds: { type: integer }
        media_type: { type: string, enum: [video, audio] }
        visual_support: { type: string, enum: [high, medium, low] }
        title_internal: { type: string }
    CatalogItemStaff:
      allOf:
        - { $ref: "#/components/schemas/CatalogItemWrite" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            status:
              type: string
              enum: [draft, level_qa, published, archived]
            has_l1_translation: { type: boolean, enum: [false] }
    LearningSession:
      type: object
      required: [id, device_class, started_at]
      properties:
        id: { type: string, format: uuid }
        device_class: { type: string, enum: [web, phone, ipad] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_seconds: { type: integer, nullable: true }
    LearnerProgress:
      type: object
      required: [minutes_comprehensible, current_ci_level]
      properties:
        minutes_comprehensible: { type: integer, minimum: 0 }
        current_ci_level: { type: integer, minimum: 0, maximum: 4 }
      additionalProperties: false
    Flags:
      type: object
      required: [speaking_enabled, l1_subtitles_enabled, grammar_enabled, flashcards_enabled]
      properties:
        speaking_enabled: { type: boolean }
        l1_subtitles_enabled: { type: boolean }
        grammar_enabled: { type: boolean }
        flashcards_enabled: { type: boolean }
