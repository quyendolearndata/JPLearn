name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test:guard
      - run: pnpm --filter @jplearn/domain test
      - run: pnpm --filter @jplearn/web test
      - run: pnpm --filter @jplearn/mobile test

  api-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jplearn
          POSTGRES_PASSWORD: jplearn
          POSTGRES_DB: jplearn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jplearn -d jplearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-secret-at-least-32-bytes-long-for-pyjwt-security
      DATABASE_URL: postgresql://jplearn:jplearn@localhost:5432/jplearn_test
      JPLEARN_TEST_DATABASE_URL: postgresql://jplearn:jplearn@localhost:5432/jplearn_test
    steps:
      - uses: actions/checkout@v4
      # tsx drives scripts/assert-no-textbook.ts, which the FR-NEG-004 negative
      # test invokes; the backend itself no longer needs Node (ADR-004).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
        working-directory: apps/api-python
      # Module form, not the console script: uv marks the whole .venv hidden on
      # macOS and CPython skips hidden .pth files, so the editable install is not
      # importable there. PYTHONPATH=src behaves the same on every OS.
      # Alembic owns DDL (ADR-004); pytest applies migrations through pg_harness.
      - run: PYTHONPATH=src uv run python -m jplearn_api.entrypoints.cli.migrate upgrade
        working-directory: apps/api-python
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run ruff check .
        working-directory: apps/api-python
      - run: uv run pytest
        working-directory: apps/api-python
      - run: PYTHONPATH=src uv run python -m jplearn_api.tooling.openapi_diff
        working-directory: apps/api-python

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-secret-at-least-32-bytes-long-for-pyjwt-security
      JPLEARN_E2E_SOURCE_MP4: /tmp/e2e-synthetic.mp4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install
      - run: uv sync --frozen
        working-directory: apps/api-python
      - run: pnpm --filter @jplearn/web exec playwright install --with-deps chromium
      - name: Generate synthetic MP4 source
        run: >-
          ffmpeg -hide_banner -loglevel error -y
          -f lavfi -i testsrc=size=640x360:rate=24
          -f lavfi -i sine=frequency=1000:sample_rate=48000
          -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac
          "$JPLEARN_E2E_SOURCE_MP4"
      - name: Run Chromium web E2E
        run: apps/api-python/differential/web-e2e-python.sh --project=chromium
      - name: Collect Playwright test results
        if: failure()
        run: |
          mkdir -p apps/web/test-results
          for result_dir in /tmp/jplearn-e2e-*/test-results; do
            if [[ -d "$result_dir" ]]; then
              cp -R "$result_dir"/. apps/web/test-results/
            fi
          done
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-playwright-results
          path: apps/web/test-results
          if-no-files-found: warn

  container-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run container verification gate
        run: apps/api-python/scripts/verify-container.sh
      - name: Upload container verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-verification-manifest
          path: apps/api-python/container_verification_manifest.json
