name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jplearn
          POSTGRES_PASSWORD: jplearn
          POSTGRES_DB: jplearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jplearn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jplearn:jplearn@localhost:5432/jplearn
      JWT_SECRET: ci-secret
      API_PUBLIC_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @jplearn/api exec prisma generate
      - run: pnpm test:guard
      - run: pnpm --filter @jplearn/domain test
      - run: pnpm --filter @jplearn/api exec prisma migrate deploy
      - run: pnpm --filter @jplearn/api test
      - run: pnpm --filter @jplearn/mobile test
